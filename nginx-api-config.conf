# Nginx configuration for PowderChest with Visitor API

# Add this to your existing Nginx site configuration file
# (usually in /etc/nginx/sites-available/powderchest.com)
#
# Choose the upstream based on your topology:
# - Same host as visitor-api: http://localhost:5000
# - Split host (Pi4 nginx -> Pi5 visitor-api): http://<pi5-lan-ip>:5000

# API proxy - add this inside your server block
location /api/ {
    proxy_pass http://<visitor-api-host>:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # CORS headers (if needed beyond what Flask provides)
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
}

# Health check endpoint
location /health {
    proxy_pass http://<visitor-api-host>:5000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
