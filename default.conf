# --- 1. THE MAIN PORTAL (powderchest.com) ---
server {
    listen 80;
    server_name powderchest.com www.powderchest.com;

    location / {
        root /var/www/powderchest;
        index index.html;
    }

    # NEW: This allows your website to read the health reports
    location /status/ {
        alias /var/www/powderchest/status/;  # Where the JSON files live
        index index.html;

        # This allows the JavaScript to find the JSON files
        try_files $uri $uri/ =404;

        # Add CORS so your dashboard can read the data without security blocks
        add_header Access-Control-Allow-Origin *; # Crucial for the dashboard to work & read the data
    }

    location /fonts/ {
        root /var/www/powderchest;
        add_header Access-Control-Allow-Origin *;
    }
}

# --- 2. THESTANDARD MAP ---
server {
    listen 80;
    server_name thestandard.powderchest.com;

    location / {
        proxy_pass http://192.168.0.105:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# --- 3. FAKEMAS0N MAP ---
server {
    listen 80;
    server_name fakemas0n.powderchest.com;

    location / {
